<div class="hero-title">
<h1>Bible AI Assistant</h1>
<p>Ask any Bible question and receive intelligent biblical answers.</p>

<body>
<div class="container">

<div class="chat-box" id="chat">

<div class="message ai">
<p>
👋 Welcome! Ask me anything about the Bible.
</p>
</div>

</div>

<div class="input-area">

<input
type="text"
id="question"
placeholder="Ask a Bible question..."
>

<button onclick="askAI()">
Send
</button>

</div>

</div>

 <script>

async function askAI() {

    const question = document.getElementById("question").value.trim();

    if (!question) return;

    const chat = document.getElementById("chat");

    chat.innerHTML += `
    <div class="message user">
        <p>${question}</p>
    </div>`;

    document.getElementById("question").value = "";

    chat.innerHTML += `
    <div class="message ai" id="loading">
        <p>Thinking...</p>
    </div>`;

    chat.scrollTop = chat.scrollHeight;

    const apiKey = "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";   // Paste your OpenRouter API key here

    try {

        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {

            method: "POST",

            headers: {
                "Authorization": `Bearer ${apiKey}`,
                "Content-Type": "application/json",
                "HTTP-Referer": "http://localhost:5500",
                "X-Title": "ECR Bible AI"
            },

            body: JSON.stringify({

                model: "openrouter/auto",

                messages: [
                    {
                        role: "system",
                        content: "You are a Christian Bible assistant. Answer Bible questions using Scripture. Be respectful, accurate, and cite Bible references whenever possible."
                    },
                    {
                        role: "user",
                        content: question
                    }
                ]

            })

        });

        const data = await response.json();

        const loading = document.getElementById("loading");
        if (loading) loading.remove();

        if (!response.ok) {
            throw new Error(data.error?.message || "Unable to contact AI.");
        }

        chat.innerHTML += `
        <div class="message ai">
            <p>${data.choices[0].message.content}</p>
        </div>`;

        chat.scrollTop = chat.scrollHeight;

    } catch (err) {

        const loading = document.getElementById("loading");
        if (loading) loading.remove();

        chat.innerHTML += `
        <div class="message ai">
            <p><strong>Error:</strong> ${err.message}</p>
        </div>`;

        console.error(err);
    }

}

document.getElementById("question").addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        askAI();
    }
});

</script>
